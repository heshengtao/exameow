name: Release Desktop

on:
  push:
    tags:
      - 'v*'

env:
  APP_NAME: Exameow
  PNPM_VERSION: '10'
  NODE_VERSION: '22'

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build
        working-directory: frontend

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-desktop
          path: frontend/dist

  build-desktop:
    needs: build-frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: linux_amd64
          - platform: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: linux_arm64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows_amd64
          - platform: macos-latest
            target: aarch64-apple-darwin
            artifact: macos_arm64
            bundles: --bundles app
          - platform: macos-latest
            target: x86_64-apple-darwin
            artifact: macos_amd64
            bundles: --bundles app

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist-desktop
          path: frontend/dist

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux deps
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf pkg-config libclang-dev libxcb1-dev libxrandr-dev libdbus-1-dev libpipewire-0.3-dev libspa-0.2-dev libwayland-dev libegl-dev xdg-utils libgbm-dev

      - name: Build Tauri
        run: pnpm tauri build --target ${{ matrix.target }} ${{ matrix.bundles }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Retry Build Tauri (transient download failures)
        if: failure() && matrix.platform == 'windows-latest'
        run: pnpm tauri build --target ${{ matrix.target }} ${{ matrix.bundles }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Collect Linux artifacts
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/bundle/deb/*.deb dist/Exameow-${{ github.ref_name }}-${{ matrix.artifact }}.deb
          cp target/${{ matrix.target }}/release/bundle/appimage/*.AppImage dist/Exameow-${{ github.ref_name }}-${{ matrix.artifact }}.AppImage
          cp target/${{ matrix.target }}/release/bundle/appimage/*.AppImage.sig dist/Exameow-${{ github.ref_name }}-${{ matrix.artifact }}.AppImage.sig
        shell: bash

      - name: Collect Windows artifacts
        if: matrix.platform == 'windows-latest'
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target/${{ matrix.target }}/release/bundle/msi/*.msi dist/Exameow-${{ github.ref_name }}-${{ matrix.artifact }}.msi
          Copy-Item target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe dist/Exameow-${{ github.ref_name }}-${{ matrix.artifact }}-setup.exe
          Copy-Item target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe.sig dist/Exameow-${{ github.ref_name }}-${{ matrix.artifact }}-setup.exe.sig
          Copy-Item target/${{ matrix.target }}/release/exameow.exe dist/Exameow.exe
          Compress-Archive -Path dist/Exameow.exe -DestinationPath dist/Exameow-${{ github.ref_name }}-${{ matrix.artifact }}-portable.zip
          Remove-Item dist/Exameow.exe
        shell: pwsh

      - name: Collect macOS artifacts
        if: matrix.platform == 'macos-latest'
        run: |
          mkdir -p dist
          APP_DIR="target/${{ matrix.target }}/release/bundle/macos"
          APP=$(find "$APP_DIR" -maxdepth 1 -name "*.app" -type d | head -n 1)
          xattr -cr "$APP"
          python3 -m venv /tmp/dmgenv
          /tmp/dmgenv/bin/pip install dmgbuild
          WORKDIR=$(mktemp -d)
          cp -R "$APP" "$WORKDIR/Exameow.app"
          (cd "$WORKDIR" && /tmp/dmgenv/bin/dmgbuild -s "$GITHUB_WORKSPACE/scripts/dmg-settings.json" "Exameow" "$GITHUB_WORKSPACE/dist/Exameow-${{ github.ref_name }}-${{ matrix.artifact }}.dmg")
          rm -rf "$WORKDIR"
          cp "$APP_DIR"/*.app.tar.gz dist/Exameow-${{ github.ref_name }}-${{ matrix.artifact }}.app.tar.gz
          cp "$APP_DIR"/*.app.tar.gz.sig dist/Exameow-${{ github.ref_name }}-${{ matrix.artifact }}.app.tar.gz.sig
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.artifact }}
          path: dist/*

  release:
    needs: build-desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
          pattern: desktop-*

      - name: Generate latest.json for updater
        run: |
          node -e "
          const fs = require('fs');
          const tag = process.env.TAG;
          const base = 'https://github.com/' + process.env.REPO + '/releases/download/' + tag + '/';
          const files = fs.readdirSync('artifacts');
          const find = (suffix, mid) => files.find((f) => f.endsWith(suffix) && (!mid || f.includes(mid)));
          const platforms = {};
          const add = (key, fileSuffix, sigSuffix, mid) => {
            const f = find(fileSuffix, mid);
            const s = find(sigSuffix, mid);
            if (f && s) {
              platforms[key] = {
                signature: fs.readFileSync('artifacts/' + s, 'utf8').trim(),
                url: base + f,
              };
            }
          };
          add('windows-x86_64', '-setup.exe', '-setup.exe.sig');
          add('darwin-aarch64', '.app.tar.gz', '.app.tar.gz.sig', 'macos_arm64');
          add('darwin-x86_64', '.app.tar.gz', '.app.tar.gz.sig', 'macos_amd64');
          add('linux-x86_64', 'linux_amd64.AppImage', 'linux_amd64.AppImage.sig');
          fs.writeFileSync('artifacts/latest.json', JSON.stringify({
            version: tag.replace(/^v/, ''),
            notes: 'See release notes',
            pub_date: new Date().toISOString(),
            platforms,
          }, null, 2));
          "
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ env.APP_NAME }} ${{ github.ref_name }}
          prerelease: false
          draft: true
          body: |
            ## 🔗 Quick Links
            - [Docker Image](https://hub.docker.com/r/ailm32442/exameow)
            - [Documentation](https://github.com/${{ github.repository }}#readme)

            ## 📦 Downloads

            👉 [Windows-msi](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Exameow-${{ github.ref_name }}-windows_amd64.msi)

            👉 [Windows-portable](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Exameow-${{ github.ref_name }}-windows_amd64-portable.zip)

            👉 [MacOS-dmg-Arm64](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Exameow-${{ github.ref_name }}-macos_arm64.dmg)

            👉 [MacOS-dmg-X64](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Exameow-${{ github.ref_name }}-macos_amd64.dmg)

            👉 [Linux-AppImage-X86_64](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Exameow-${{ github.ref_name }}-linux_amd64.AppImage)

            👉 [Linux-AppImage-Arm64](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Exameow-${{ github.ref_name }}-linux_arm64.AppImage)

            👉 [Linux-deb-X86_64](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Exameow-${{ github.ref_name }}-linux_amd64.deb)

            👉 [Linux-deb-Arm64](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Exameow-${{ github.ref_name }}-linux_arm64.deb)

            👉 [Android-apk-Arm64](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Exameow-${{ github.ref_name }}-android_arm64.apk)

            ## ⚠️ macOS: "App is damaged" / 「App 已损坏，无法打开」

            **EN:** The app is ad-hoc signed (not notarized). macOS quarantines apps downloaded from the internet. Run the command below in Terminal, then open the app normally:

            **中文：** 应用为自签名（未公证），从网络下载会带隔离属性。在终端执行以下命令后即可正常打开：

            ```bash
            xattr -cr /Applications/Exameow.app
            ```
          files: artifacts/*
          fail_on_unmatched_files: false
