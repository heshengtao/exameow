name: Sync Release to GitCode

# GitCode 的「仓库镜像」只同步分支/tag/提交，不会同步 Release 附件，
# 所以发布包需要单独通过 GitCode OpenAPI 上传一份。
#
# 触发方式：
#   1. 在 GitHub 上把 CI 生成的草稿 Release 正式发布（published）时自动执行；
#   2. 手动 workflow_dispatch 补同步某个 tag。
#
# 需要配置：
#   - Secret  GITCODE_TOKEN：https://gitcode.com/setting/token-classic 生成的个人访问令牌
#   - Variable GITCODE_REPO ：GitCode 仓库路径，如 heshengtao/exameow
#                              （未设置时回退到下面的默认值）

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: '要同步的 Release tag，例如 v1.7.5'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sync-gitcode-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_REPO: ${{ github.repository }}
      GITCODE_REPO: ${{ vars.GITCODE_REPO || github.repository }}
    steps:
      # 始终用默认分支上的脚本，避免旧 tag 里还没有这个脚本
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check GitCode token
        id: guard
        env:
          TOKEN: ${{ secrets.GITCODE_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice title=GitCode sync skipped::GITCODE_TOKEN 未配置，跳过发布包同步"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download assets from the GitHub release
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh release download "$TAG" --repo "$GH_REPO" --dir dist --clobber
          ls -lh dist

      - name: Sync release metadata and assets to GitCode
        if: steps.guard.outputs.skip != 'true'
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/sync-gitcode-release.mjs
