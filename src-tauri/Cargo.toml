[package]
name = "exameow"
version = "1.7.4"
description = "AI-powered exam question generator"
edition = "2021"

[lib]
name = "exameow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tokio = { version = "1", features = ["sync", "macros", "rt", "net", "time"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-sharekit = "0.3"
tauri-plugin-screenrecord = { path = "../plugins/screenrecord" }
exameow-core = { path = "../packages/core" }
exameow-mcp = { path = "../packages/mcp" }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
flate2 = "1"
tar = "0.4"
sha2 = "0.10"
semver = "1"

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
xcap = "0.5"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"

# Windows: mount `exameow` via a small .cmd shim in the user PATH (HKCU\Environment).
[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[target.'cfg(target_os = "ios")'.dependencies]
objc = "0.2"
